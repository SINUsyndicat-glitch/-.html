        async function checkAndSwitchNetwork() {
            const baseChainId = "0x2105"; 
            try {
                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (currentChainId !== baseChainId) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: baseChainId }],
                        });
                    } catch (switchError) {
                        if (switchError.code === 4902) {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: baseChainId,
                                    chainName: 'Base Mainnet',
                                    nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
                                    rpcUrls: ['https://mainnet.base.org'],
                                    blockExplorerUrls: ['https://basescan.org']
                                }],
                            });
                        } else {
                            throw switchError;
                        }
                    }
                }
                return true;
            } catch (error) {
                alert("الرجاء تحويل المحفظة إلى شبكة Base يدوياً!");
                return false;
            }
        }

        document.getElementById('connectBtn').onclick = async () => {
            if (!window.ethereum) return alert("يرجى تثبيت MetaMask أولاً!");
            
            try {
                const networkOk = await checkAndSwitchNetwork();
                if (!networkOk) return;

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                userAddress = await signer.getAddress();
                
                contract = new ethers.Contract(contractAddress, predictionAbi, signer);
                sinuContract = new ethers.Contract(sinuTokenAddress, erc20Abi, signer);
                
                try {
                    tokenDecimals = await sinuContract.decimals();
                } catch(e) {}

                document.getElementById('status').innerText = `متصل: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`;
                document.getElementById('connectBtn').style.display = 'none';
                
                displayEntryFee();
                loadMatches();
                
            } catch (error) {
                alert("فشل التوصيل: " + error.message);
            }
        };

        async function displayEntryFee() {
            try {
                const feeBigNum = await contract.entryFee();
                const formattedFee = ethers.utils.formatUnits(feeBigNum, tokenDecimals);
                document.getElementById('feeAmount').innerText = formattedFee;
                document.getElementById('feeContainer').style.display = 'block';
            } catch (e) {
                document.getElementById('status').innerText = "خطأ في الاتصال بالشبكة وعقد الـ Smart Contract.";
            }
        }

        function loadMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = "";
            const now = new Date().getTime();
            
            matches.forEach(match => {
                const startTime = new Date(match.time).getTime();
                // قفل التوقعات تلقائياً قبل انطلاق اللقاء بـ 30 دقيقة لحفظ الأمان ونزاهة العقود
                const isLocked = (now + 30 * 60 * 1000) >= startTime;
                const formattedTime = new Date(match.time).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
                
                const matchCard = document.createElement('div');
                matchCard.className = 'match-card';
                
                matchCard.innerHTML = `
                    <h3>${match.name}</h3>
                    <div class="match-meta">موعد المباراة: ${formattedTime}</div>
                    <div class="btn-group">
                        <button ${isLocked ? 'disabled' : ''} data-prediction="1">فوز الفريق 1</button>
                        <button ${isLocked ? 'disabled' : ''} data-prediction="2">تعادل</button>
                        <button ${isLocked ? 'disabled' : ''} data-prediction="3">فوز الفريق 2</button>
                    </div>
                    ${isLocked ? '<p class="locked-text">⚠️ انتهى الوقت المحدد لهذه المباراة.</p>' : ''}
                `;
                
                if (!isLocked) {
                    matchCard.querySelectorAll('button').forEach(button => {
                        button.onclick = () => predict(match.id, button.getAttribute('data-prediction'));
                    });
                }
                container.appendChild(matchCard);
            });
        }

        async function predict(id, prediction) {
            if (!contract || !sinuContract) return alert("الرجاء ربط المحفظة أولاً!");
            
            try {
                const fee = await contract.entryFee();
                const allowed = await sinuContract.allowance(userAddress, contractAddress);
                
                if (allowed.lt(fee)) {
                    alert("خطوة أمان: يرجى الموافقة على الـ Approve أولاً للسماح للمنصة بخصم قيمة الرسوم المتفق عليها برمجياً.");
                    const approveTx = await sinuContract.approve(contractAddress, fee);
                    document.getElementById('status').innerText = "جاري تأكيد معاملة الأمان...";
                    await approveTx.wait();
                }
                
                document.getElementById('status').innerText = "يرجى الموافقة وتأكيد المعاملة النهائية في المحفظة لرفع التوقع الحصري...";
                const predictTx = await contract.placePrediction(id, prediction);
                
                document.getElementById('status').innerText = "جاري رفع التوقع للشبكة...";
                await predictTx.wait();
                
                document.getElementById('status').innerText = "تم تسجيل توقعك بنجاح! بالتوفيق 🏆";
                alert("تم إدراج توقعك في البلوكشين بنجاح!");
                
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء التوقع: " + (error.data?.message || error.message));
            }
        }
