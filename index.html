        async function checkAndSwitchNetwork() {
            const baseChainId = "0x2105"; 
            try {
                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (currentChainId !== baseChainId) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: baseChainId }],
                        });
                    } catch (switchError) {
                        if (switchError.code === 4902) {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: baseChainId,
                                    chainName: 'Base Mainnet',
                                    nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
                                    rpcUrls: [alchemyRpcUrl], 
                                    blockExplorerUrls: ['https://basescan.org']
                                }],
                            });
                        } else {
                            throw switchError;
                        }
                    }
                }
                return true;
            } catch (error) {
                alert("الرجاء تحويل المحفظة إلى شبكة Base يدوياً!");
                return false;
            }
        }

        document.getElementById('connectBtn').onclick = async () => {
            if (!window.ethereum) return alert("يرجى تثبيت MetaMask أولاً!");
            
            try {
                const networkOk = await checkAndSwitchNetwork();
                if (!networkOk) return;

                // قراءة البيانات الأساسية باستقرار تام وعبر الرابط الخاص بك
                const readProvider = new ethers.providers.JsonRpcProvider(alchemyRpcUrl);
                contractForRead = new ethers.Contract(contractAddress, predictionAbi, readProvider);
                sinuContractForRead = new ethers.Contract(sinuTokenAddress, erc20Abi, readProvider);

                // إعداد المحفظة لعمليات الدفع والتوقيع
                const walletProvider = new ethers.providers.Web3Provider(window.ethereum);
                await walletProvider.send("eth_requestAccounts", []);
                const signer = walletProvider.getSigner();
                userAddress = await signer.getAddress();
                
                contractForWrite = new ethers.Contract(contractAddress, predictionAbi, signer);
                sinuContractForWrite = new ethers.Contract(sinuTokenAddress, erc20Abi, signer);
                
                try {
                    tokenDecimals = await sinuContractForRead.decimals();
                } catch(e) {}

                document.getElementById('status').innerText = `متصل: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`;
                document.getElementById('connectBtn').style.display = 'none';
                
                displayEntryFee();
                loadMatches();
                
            } catch (error) {
                alert("فشل التوصيل: " + error.message);
            }
        };

            try {

                document.getElementById('feeAmount').innerText = formattedFee;
                document.getElementById('feeContainer').style.display = 'block';
            } catch (e) {
                document.getElementById('status').innerText = "حدث خطأ أثناء جلب الرسوم الأساسية من العقد.";
            }
        }

        function loadMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = "";
            const now = new Date().getTime();
            
            matches.forEach(match => {
                const startTime = new Date(match.time).getTime();
                const isLocked = (now + 30 * 60 * 1000) >= startTime;
                const formattedTime = new Date(match.time).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
                
                const matchCard = document.createElement('div');
                matchCard.className = 'match-card';
                
                matchCard.innerHTML = `
                    <h3>${match.name}</h3>
                    <div class="match-meta">موعد المباراة: ${formattedTime}</div>
                    <div class="btn-group">
                        <button ${isLocked ? 'disabled' : ''} data-prediction="1">فوز الفريق 1</button>
                        <button ${isLocked ? 'disabled' : ''} data-prediction="2">فوز الفريق 2</button>
                        <button ${isLocked ? 'disabled' : ''} data-prediction="3">تعادل</button>
                    </div>
                    ${isLocked ? '<p class="locked-text">⚠️ انتهى الوقت المحدد لهذه المباراة.</p>' : ''}
                `;
                
                if (!isLocked) {
                    matchCard.querySelectorAll('button').forEach(button => {
                        button.onclick = () => predict(match.id, button.getAttribute('data-prediction'));
                    });
                }
                container.appendChild(matchCard);
            });
        }

        async function predict(id, prediction) {
            if (!contractForWrite || !sinuContractForWrite) return alert("الرجاء ربط المحفظة أولاً!");
            
            try {
                document.getElementById('status').innerText = "جاري فحص صلاحيات الأمان وعقد العملة...";
                
                const fee = await contractForRead.entryFee();
                const allowed = await sinuContractForRead.allowance(userAddress, contractAddress);
                
                if (allowed.lt(fee)) {
                    alert("خطوة أمان: يرجى أولاً تأكيد معاملة الـ Approve للسماح بخصم قيمة الرسوم المتفق عليها برمجياً.");
                    
                    // تمرير الـ gasLimit يدوياً لتخطي فحص المحاكاة المزدحم في ميتاماسك على شبكة Base
                    const approveTx = await sinuContractForWrite.approve(contractAddress, fee, {
                        gasLimit: ethers.BigNumber.from("70000")
                    });
                    
                    document.getElementById('status').innerText = "جاري تأكيد معاملة الأمان (Approve)...";
                    await approveTx.wait();
                    document.getElementById('status').innerText = "تم تأكيد الصلاحية بنجاح! جاري طلب التوقع...";
                }
                
                const predictionNumber = parseInt(prediction);
                document.getElementById('status').innerText = "يرجى الموافقة وتأكيد المعاملة النهائية في المحفظة...";
                
                // تمرير الـ gasLimit يدوياً لمعاملة التوقع لتفادي انهيار الـ Simulation
                const predictTx = await contractForWrite.placePrediction(id, predictionNumber, {
                    gasLimit: ethers.BigNumber.from("120000")
                });
                
                document.getElementById('status').innerText = "جاري رفع التوقع للبلوكشين...";
                await predictTx.wait();
                
                document.getElementById('status').innerText = "تم تسجيل توقعك بنجاح! بالتوفيق 🏆";
                alert("تم إدراج توقعك في البلوكشين بنجاح!");
                
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "فشلت المعاملة.";
                
                let errorMsg = error.message;
                if (error.data && error.data.message) {
                    errorMsg = error.data.message;
                } else if (error.reason) {
                    errorMsg = error.reason;
                }
                alert("حدث خطأ أثناء التوقع: " + errorMsg);
            }
        }
    </script>
</body>
</html>
